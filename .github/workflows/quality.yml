name: AK Screen - Protected full checks
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact revision in the private source repository
        required: true
        type: string
      check_mode:
        description: Full suite or quick type-check
        type: choice
        options: [full, compile, regressions]
        default: full
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Validate revision
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'An exact commit SHA is required' }
      - uses: actions/checkout@v4
        with:
          repository: Edgajuman/AKScreen
          ref: ${{ inputs.source_sha }}
          path: source
          ssh-key: ${{ secrets.AKSCREEN_SOURCE_SSH_KEY }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Desktop libraries and external test oracle
        timeout-minutes: 10
        run: |
          for akscreen_sources_path in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$akscreen_sources_path" ]; then
              sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' "$akscreen_sources_path"
            fi
          done
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y libasound2-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxtst-dev libxrandr-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libgbm-dev libpipewire-0.3-dev libspa-0.2-dev libxcb-randr0-dev libdbus-1-dev libclang-dev pkg-config mesa-vulkan-drivers fonts-noto-cjk
      - name: Pinned modern external codec oracle
        if: inputs.check_mode != 'compile'
        run: |
          oracle_name=ffmpeg-n9.0.2-23-g27b46f0fbc-linux64-gpl-9.0.tar.xz
          oracle_dir="$RUNNER_TEMP/akscreen-test-oracle"
          mkdir -p "$oracle_dir"
          curl --fail --location --retry 3 "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-08-13-05/$oracle_name" -o "$oracle_dir/oracle.tar.xz"
          echo "14020417ff8ef01470e8cb771355e65c37aff62b80fb0be41eeb7611d1360902  $oracle_dir/oracle.tar.xz" | sha256sum --check -
          tar -xJf "$oracle_dir/oracle.tar.xz" -C "$oracle_dir" --strip-components=1
          echo "$oracle_dir/bin" >> "$GITHUB_PATH"
          "$oracle_dir/bin/ffmpeg" -version
          "$oracle_dir/bin/ffmpeg" -hide_banner -demuxers 2>/dev/null | grep -w apv
      - name: Format and lint (private diagnostics)
        env:
          AKSCREEN_CHECK_MODE: ${{ inputs.check_mode }}
          AKSCREEN_CHECK_PHASE: lint
        run: python .github/scripts/quality.py
      - name: Encrypt lint diagnostics
        if: always()
        shell: pwsh
        run: ./.github/scripts/seal-log.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Diagnostics-lint
          path: ${{ runner.temp }}/akscreen-build.p7m
          retention-days: 7
          if-no-files-found: ignore
      - name: Tests and production performance (private diagnostics)
        if: always() && inputs.check_mode != 'compile'
        env:
          AKSCREEN_CHECK_MODE: ${{ inputs.check_mode }}
          AKSCREEN_CHECK_PHASE: tests
        run: python .github/scripts/quality.py
      - name: Encrypt test diagnostics
        if: always()
        shell: pwsh
        run: ./.github/scripts/seal-log.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Diagnostics-tests
          path: ${{ runner.temp }}/akscreen-build.p7m
          retention-days: 7
          if-no-files-found: ignore
      - name: Architecture, attribution and portability (private diagnostics)
        if: always() && inputs.check_mode == 'full'
        env:
          AKSCREEN_CHECK_MODE: ${{ inputs.check_mode }}
          AKSCREEN_CHECK_PHASE: rest
        run: python .github/scripts/quality.py
      - name: Encrypt diagnostics
        if: always()
        shell: pwsh
        run: ./.github/scripts/seal-log.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Diagnostics-full-checks
          path: ${{ runner.temp }}/akscreen-build.p7m
          retention-days: 7
          if-no-files-found: ignore
